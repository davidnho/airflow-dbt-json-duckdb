version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: email
        data_tests: [not_null]
  - name: stg_sales
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]
  - name: customer_sales_summary
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
